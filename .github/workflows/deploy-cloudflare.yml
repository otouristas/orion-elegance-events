name: Deploy to Cloudflare Workers

# Builds main with OpenNext and deploys it to the `orion-elegance-events`
# Worker that serves ktimaorion.gr. Manual only for now: the live design
# (Worker version d60b4fc7) is not in main yet, so deploying main would bring
# back the old design. Re-enable `push` once main matches the live site.
on:
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:cloudflare
      - name: Deploy
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3ae246eded35e99220b461c2ca5ff158
